<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Mintyx Deploy</title>
<style nonce="__NONCE__">
/*
 * The panel's Flover Diary look (web/src/app.css): a sky-blue dotted page, paper cards, ink
 * text, a little blossom pink, handwritten headings. The palettes are copies of
 * web/src/theme/themes.ts; keep them in step. Forms, numbers and secrets stay straight; only
 * the QR polaroid and the password note are tilted.
 */
@font-face { font-family: "Long Cang"; src: url(/fonts/LongCang-subset.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Caveat"; src: url(/fonts/Caveat-600-subset.woff2) format("woff2"); font-weight: 600; font-display: swap; }
:root {
  --sky: #e6eff8; --paper: #ffffff; --ink: #1b2738; --ink-muted: #40516a; --on-ink: #ffffff;
  --blossom: #b83a73; --on-blossom: #ffffff; --blossom-deep: #7a2149; --blossom-soft: #f6d3e2; --note: #fbe3ee;
  --sky-deep: #2f6fb5; --sky-photo: #cfdff0; --line: #7f95b0; --hairline: #e3ebf5;
  --dot: rgba(127, 149, 176, 0.28); --shadow-paper: 0 6px 14px rgba(27, 39, 56, 0.16);
  --ok: #1f7a55; --warning: #8f5400; --error: #b42318;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --font-hand: "Long Cang", "KaiTi", "STKaiti", cursive;
  --font-script: "Caveat", "Segoe Print", cursive;
  --r-paper: 6px; --r-field: 8px; --r-ticket: 12px; --r-pill: 30px;
  color-scheme: light;
}
:root[data-theme="night"] {
  --sky: #121a29; --paper: #1c2638; --ink: #e8eef7; --ink-muted: #aab7ca; --on-ink: #121a29;
  --blossom: #f08bb7; --on-blossom: #2a0d1b; --blossom-deep: #ffd3e6; --blossom-soft: #4a2438; --note: #3b2232;
  --sky-deep: #8fbcf0; --sky-photo: #22324a; --line: #647a99; --hairline: #26334a;
  --dot: rgba(143, 188, 240, 0.14); --shadow-paper: 0 6px 16px rgba(0, 0, 0, 0.45);
  --ok: #64d6a0; --warning: #f2b866; --error: #f49a8a;
  color-scheme: dark;
}
:root[data-theme="midnight"] {
  --sky: #000000; --paper: #0e131c; --ink: #e6ecf5; --ink-muted: #9eabbf; --on-ink: #000000;
  --blossom: #f07fae; --on-blossom: #22091a; --blossom-deep: #ffcbe0; --blossom-soft: #3d1c2e; --note: #2e1a26;
  --sky-deep: #82b3ec; --sky-photo: #141e2d; --line: #55688a; --hairline: #1a2230;
  --dot: rgba(130, 179, 236, 0.12); --shadow-paper: 0 6px 16px rgba(0, 0, 0, 0.7);
  --ok: #5ad18f; --warning: #f0b35b; --error: #f08c6b;
  color-scheme: dark;
}
/* Long Cang's Latin letters are an afterthought; English headings use Caveat. */
html[lang="en"] { --font-hand: "Caveat", "Segoe Print", cursive; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  color: var(--ink); font: 15px/1.6 var(--font);
  background-color: var(--sky);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size: 22px 22px; background-attachment: fixed;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 22px 56px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 30px; height: 30px; flex: none; }
.logo-bg { fill: var(--ink); }
.logo-m { fill: none; stroke: var(--paper); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.logo-dot { fill: var(--blossom); }
.brand-name { font: 600 32px/32px var(--font-script); color: var(--ink); }
.brand-sub { font: 400 22px/26px var(--font-hand); color: var(--blossom); margin-left: 2px; }
h1 { font: 400 42px/46px var(--font-hand); margin: 0 0 6px; color: var(--ink); }
h2 { font: 400 26px/30px var(--font-hand); margin: 0 0 6px; color: var(--sky-deep); }
p { margin: 0 0 12px; }
.lead { color: var(--ink-muted); margin-bottom: 24px; }
.muted { color: var(--ink-muted); font-size: 13px; }
a { color: var(--sky-deep); text-underline-offset: 3px; }
a:hover { color: var(--blossom); }

/* The steps: upcoming ones are pencilled in, the current one is the blossom pill the panel's
   nav uses, finished ones get a blossom tick. */
.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; list-style: none; padding: 0; margin: 0 0 22px; font-size: 14px; color: var(--ink-muted); }
.steps li { display: flex; align-items: center; gap: 8px; }
.steps li + li::before { content: ""; width: 26px; border-top: 1.5px dashed var(--line); }
.steps .step { display: inline-flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: var(--r-pill); }
.steps .num { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font: 600 19px/1 var(--font-script); }
.steps li[aria-current="step"] .step { background: var(--blossom-soft); color: var(--blossom-deep); font-weight: 600; padding-right: 14px; }
.steps li[aria-current="step"] .num { background: var(--blossom); border: 0; color: var(--on-blossom); }
.steps li.past .num { border: 1.5px solid var(--blossom); color: var(--blossom); font-size: 0; }
.steps li.past .num::after { content: "✓"; font-size: 15px; font-family: var(--font); font-weight: 700; }

/* ---------- paper ---------- */
.card { position: relative; background: var(--paper); border-radius: var(--r-paper); box-shadow: var(--shadow-paper); padding: 20px 24px 22px; margin-bottom: 20px; }
.card > :last-child { margin-bottom: 0; }
.card > h2 { margin: -2px -24px 14px; padding: 0 24px 10px; border-bottom: 1.5px dashed var(--line); }
.tilt { transform: rotate(-1deg); }
.tape {
  position: absolute; top: -9px; left: 50%; width: 74px; height: 20px; margin-left: -37px;
  background: color-mix(in srgb, var(--blossom) 38%, transparent); transform: rotate(-4deg); pointer-events: none;
}
.tape.blue { background: color-mix(in srgb, var(--sky-deep) 36%, transparent); transform: rotate(3deg); }
/* The one-time password is a sticky note: pink paper, deep blossom ink. */
.card.sticky { background: var(--note); color: var(--blossom-deep); transform: rotate(0.8deg); }
.card.sticky > h2 { color: var(--blossom-deep); border-bottom-color: color-mix(in srgb, var(--blossom) 45%, transparent); }
.card.sticky .muted, .card.sticky .kv dt { color: var(--blossom-deep); }
/* The connected server is a dashed ticket stub, like the panel's figures. */
.ticket { border: 1.5px dashed var(--line); border-radius: var(--r-ticket); background: var(--paper); padding: 12px 18px; margin-bottom: 20px; }
.ticket h2 { font: 600 15px/1.5 var(--mono); color: var(--ink); margin: 0 0 2px; overflow-wrap: anywhere; }
.ticket .muted { overflow-wrap: anywhere; }
.card-head > div { min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* ---------- form ---------- */
.grid { display: grid; grid-template-columns: 1fr 110px; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label, .label { font-size: 13px; color: var(--ink-muted); font-weight: 500; }
.label { margin-bottom: 6px; }
input[type="text"], input[type="password"], input[type="number"], textarea {
  width: 100%; min-height: 38px; padding: 7px 11px; border: 1px solid var(--line); border-radius: var(--r-field);
  background: var(--paper); color: var(--ink); font: inherit; outline: none; transition: border-color .18s, box-shadow .18s;
}
input::placeholder, textarea::placeholder { color: var(--line); opacity: 1; }
textarea { min-height: 108px; resize: vertical; font: 12px/1.5 var(--mono); }
input:hover, textarea:hover { border-color: var(--ink-muted); }
input:focus-visible, textarea:focus-visible { border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 14%, transparent); }
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--error); }
.mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }

/* Buttons are pills: the primary one solid ink, the rest drawn with a pen in dashes. */
button { font: inherit; cursor: pointer; }
.btn {
  min-height: 36px; padding: 0 18px; border-radius: var(--r-pill); border: 1.5px dashed var(--line);
  background: transparent; color: var(--ink); font-weight: 500; transition: border-color .18s, opacity .18s;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:focus-visible, .seg button:focus-visible, .tabs button:focus-visible, .chip input:focus-visible + span { outline: 2px solid var(--blossom); outline-offset: 2px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--ink); border: 1.5px solid var(--ink); color: var(--on-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { opacity: .88; }
.btn.danger { color: var(--error); border-color: var(--error); }
.btn.small { min-height: 30px; padding: 0 12px; font-size: 13px; }
.btn.wide { width: 100%; min-height: 44px; font-size: 16px; margin: 8px 0 12px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* A choice of a few: the picked one is blossom-soft, as in the panel. */
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 3px; background: var(--hairline); border-radius: var(--r-paper); margin-bottom: 14px; }
.seg button { border: 0; background: transparent; color: var(--ink-muted); padding: 4px 14px; border-radius: 4px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--blossom-soft); color: var(--blossom-deep); font-weight: 600; }
.seg.small { margin: 0; }
.seg.small button { font-size: 12px; padding: 2px 10px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: block; padding: 5px 15px; border: 1.5px dashed var(--line); border-radius: var(--r-pill); font-size: 14px; color: var(--ink-muted); }
.chip input:checked + span { background: var(--blossom-soft); border: 1.5px solid var(--blossom); color: var(--blossom-deep); font-weight: 600; }

/* Notices are notes stuck on the page: warnings on pink note paper, errors in a red pen. */
.note { border-radius: var(--r-paper); padding: 12px 16px; font-size: 14px; margin-bottom: 14px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow-paper); overflow-wrap: anywhere; }
.note.err { border: 1.5px dashed var(--error); box-shadow: none; }
.note.err strong { color: var(--error); }
.note.warn { background: var(--note); color: var(--blossom-deep); }
.note.ok { background: var(--sky-photo); box-shadow: none; }
.note strong { display: block; margin-bottom: 2px; }
.note span { display: block; }
.note .mono { color: inherit; opacity: .9; white-space: pre-wrap; font-size: 12px; display: block; margin-top: 6px; }
.note .btn { margin-top: 10px; }

.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 10px; font-size: 14px; }
.kv dt { color: var(--ink-muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- deploy progress ---------- */
.progress { list-style: none; margin: 18px 0 0; padding: 0; }
.progress li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--hairline); align-items: start; }
.progress .dot { width: 20px; height: 20px; margin-top: 2px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-size: 11px; line-height: 1; font-weight: 700; }
.progress li[data-status="running"] .dot { border: 2px solid var(--ink); border-top-color: transparent; animation: spin .8s linear infinite; }
.progress li[data-status="done"] .dot { background: var(--blossom); border: 0; color: var(--on-blossom); }
.progress li[data-status="failed"] .dot { background: var(--error); border: 0; color: var(--paper); }
.progress li[data-status="skipped"] .dot { color: var(--ink-muted); }
.progress li[data-status=""] { color: var(--ink-muted); }
.progress .detail { display: block; font-size: 12px; color: var(--ink-muted); overflow-wrap: anywhere; white-space: pre-wrap; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .progress li[data-status="running"] .dot { animation-duration: 2.4s; }
  .tilt, .card.sticky, .polaroid { transform: none !important; }
}

/* ---------- result ---------- */
.share { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
.polaroid { position: relative; width: 220px; padding: 10px 10px 14px; background: var(--paper); border-radius: var(--r-paper); box-shadow: var(--shadow-paper); transform: rotate(-2deg); }
/* Scanners want dark modules on light paper, whatever the theme. */
.qr { width: 200px; height: 200px; border-radius: 3px; background: #fff; display: block; }
.linkbox { background: var(--sky-photo); border-radius: var(--r-paper); padding: 10px 12px; max-height: 118px; overflow: auto; margin-bottom: 12px; }
.secret { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--paper); color: var(--ink); border-radius: var(--r-paper); padding: 10px 12px; margin-bottom: 14px; }
.secret .mono { font-size: 15px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.tabs button { border: 0; background: transparent; color: var(--ink-muted); padding: 3px 12px; border-radius: var(--r-pill); font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--blossom-soft); color: var(--blossom-deep); font-weight: 600; }
.apps { margin: 0 0 10px; padding-left: 20px; }
footer { margin-top: 30px; font-size: 13px; color: var(--ink-muted); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
footer .prefs { display: flex; align-items: center; gap: 8px; flex-basis: 100%; }

@media (max-width: 560px) {
  .wrap { padding: 18px 16px 40px; }
  h1 { font-size: 34px; line-height: 38px; }
  .card { padding: 16px 16px 18px; }
  .card > h2 { margin: -2px -16px 12px; padding: 0 16px 8px; }
  .grid, .share { grid-template-columns: 1fr; }
  .polaroid { margin: 4px auto 8px; }
  .steps .txt { display: none; }
  .steps li[aria-current="step"] .txt { display: inline; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect class="logo-bg" width="32" height="32" rx="7"/><path class="logo-m" d="M9 22V10l7 7 7-7v12"/><circle class="logo-dot" cx="26" cy="6" r="3.2"/></svg>
      <span class="brand-name">Mintyx</span><span class="brand-sub" data-i18n="brandSub"></span>
    </div>
    <button class="btn small" id="langToggle" type="button"></button>
  </header>

  <div class="note err" id="noToken" hidden data-i18n="noToken"></div>
  <div class="note warn" id="noPayload" hidden data-i18n="noPayload"></div>

  <main id="app" hidden>
    <ol class="steps" id="stepper">
      <li data-step="connect"><span class="step"><span class="num">1</span><span class="txt" data-i18n="stepConnect"></span></span></li>
      <li data-step="deploy"><span class="step"><span class="num">2</span><span class="txt" data-i18n="stepDeploy"></span></span></li>
      <li data-step="done"><span class="step"><span class="num">3</span><span class="txt" data-i18n="stepDone"></span></span></li>
    </ol>

    <!-- 1. connect -->
    <section id="connectView">
      <h1 data-i18n="connectTitle"></h1>
      <p class="lead" data-i18n="connectLead"></p>
      <form class="card tilt" id="connectForm" autocomplete="off" novalidate>
        <span class="tape" aria-hidden="true"></span>
        <div class="grid">
          <div class="field"><label for="host" data-i18n="host"></label>
            <input type="text" id="host" inputmode="url" spellcheck="false" autocapitalize="off" placeholder="203.0.113.10"></div>
          <div class="field"><label for="port" data-i18n="port"></label>
            <input type="number" id="port" value="22" min="1" max="65535"></div>
        </div>
        <div class="field"><label for="user" data-i18n="user"></label>
          <input type="text" id="user" value="root" spellcheck="false" autocapitalize="off"></div>

        <div class="label" data-i18n="authMethod"></div>
        <div class="seg" role="group">
          <button type="button" id="authPassword" aria-pressed="true" data-i18n="authPassword"></button>
          <button type="button" id="authKey" aria-pressed="false" data-i18n="authKey"></button>
        </div>

        <div id="passwordFields">
          <div class="field"><label for="password" data-i18n="password"></label>
            <input type="password" id="password" autocomplete="off"></div>
        </div>
        <div id="keyFields" hidden>
          <div class="field"><label for="privateKey" data-i18n="privateKey"></label>
            <textarea id="privateKey" spellcheck="false" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>
            <div class="row"><input type="file" id="keyFile" hidden><button type="button" class="btn small" id="keyFileBtn" data-i18n="chooseKeyFile"></button>
              <span class="muted" data-i18n="keyStaysLocal"></span></div></div>
          <div class="field"><label for="passphrase" data-i18n="passphrase"></label>
            <input type="password" id="passphrase" autocomplete="off"></div>
          <div class="field"><label for="sudoPassword" data-i18n="sudoPassword"></label>
            <input type="password" id="sudoPassword" autocomplete="off"></div>
        </div>

        <div class="note err" id="connectError" hidden role="alert"></div>
        <button class="btn primary wide" id="connectBtn" type="submit" data-i18n="connect"></button>
        <p class="muted" data-i18n="credentialNote"></p>
      </form>
    </section>

    <!-- connected server summary -->
    <section class="ticket" id="serverCard" hidden>
      <div class="card-head">
        <div><h2 id="serverName" class="mono"></h2><div class="muted" id="serverFingerprint"></div></div>
        <button class="btn small" id="disconnectBtn" type="button" data-i18n="disconnect"></button>
      </div>
    </section>

    <!-- 2. deploy -->
    <section id="deployView" hidden>
      <div class="card">
        <h2 data-i18n="regionTitle"></h2>
        <p class="muted" data-i18n="regionHint"></p>
        <div class="chips" id="regions" role="radiogroup"></div>
        <div class="note err" id="deployError" hidden role="alert"></div>
        <button class="btn primary wide" id="deployBtn" type="button" data-i18n="deploy"></button>
        <p class="muted" data-i18n="deployNote"></p>
        <ol class="progress" id="progress" hidden></ol>
      </div>
    </section>

    <!-- 3. result -->
    <section id="resultView" hidden>
      <div class="note ok" id="alreadyNote" hidden><strong data-i18n="alreadyTitle"></strong><span data-i18n="alreadyBody"></span></div>

      <div class="card sticky" id="passwordCard" hidden>
        <h2 data-i18n="panelPasswordTitle"></h2>
        <p class="muted" data-i18n="panelPasswordHint"></p>
        <dl class="kv"><dt data-i18n="panelUser"></dt><dd class="mono" id="adminUser"></dd></dl>
        <div class="secret"><span class="mono" id="adminPassword"></span>
          <button class="btn small" type="button" id="copyPassword" data-i18n="copy"></button></div>
        <button class="btn" type="button" id="passwordSaved" data-i18n="passwordSaved"></button>
      </div>

      <div class="card" id="shareCard" hidden>
        <h2 data-i18n="shareTitle"></h2>
        <p class="muted" data-i18n="shareHint"></p>
        <div class="share">
          <div class="polaroid"><span class="tape blue" aria-hidden="true"></span><img class="qr" id="qr" alt=""></div>
          <div>
            <div class="linkbox mono" id="link"></div>
            <div class="row"><button class="btn small" type="button" id="copyLink" data-i18n="copyLink"></button>
              <span class="muted" id="lineInfo"></span></div>
            <p class="muted" id="firewallNote"></p>
          </div>
        </div>
      </div>

      <div class="card" id="appsCard" hidden>
        <h2 data-i18n="appsTitle"></h2>
        <p class="muted" data-i18n="appsHint"></p>
        <div class="tabs" id="osTabs" role="tablist"></div>
        <ul class="apps" id="appList"></ul>
        <p class="muted"><a data-guide="clients" data-i18n="appsGuide"></a></p>
      </div>
    </section>

    <!-- tools: need only a running panel service -->
    <section id="toolsView" hidden>
      <div class="card">
        <h2 data-i18n="panelTitle"></h2>
        <p class="muted" data-i18n="panelHint"></p>
        <div class="row"><button class="btn" type="button" id="openPanel" data-i18n="openPanel"></button>
          <a id="panelLink" class="mono" hidden target="_blank" rel="noopener noreferrer"></a></div>
        <div class="note err" id="panelError" hidden role="alert"></div>
      </div>

      <div class="card" id="resetCard" hidden>
        <h2 data-i18n="resetTitle"></h2>
        <p class="muted" data-i18n="resetHint"></p>
        <div class="note err" id="resetError" hidden role="alert"></div>
        <div class="row"><button class="btn" type="button" id="resetBtn" data-i18n="resetBtn"></button></div>
      </div>

      <div class="card" id="keyCard" hidden>
        <h2 data-i18n="keyTitle"></h2>
        <p data-i18n="keyWhy"></p>
        <p class="muted" data-i18n="keyHow"></p>
        <div class="note" id="keyOutcome" hidden></div>
        <div class="row"><button class="btn primary" type="button" id="keyBtn" data-i18n="keyBtn"></button>
          <a data-guide="sshKey" data-i18n="keyGuide"></a></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="prefs"><span id="themeLabel" data-i18n="themeLabel"></span>
      <div class="seg small" role="group" aria-labelledby="themeLabel" id="themeSeg">
        <button type="button" data-pref="system" data-i18n="themeSystem"></button>
        <button type="button" data-pref="day" data-i18n="themeDay"></button>
        <button type="button" data-pref="night" data-i18n="themeNight"></button>

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode: fall back to defaults */ } },
};

let lang = store.get("mintyx.lang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
/* The panel's four appearances; "system" follows the computer's light or dark setting. */
const THEMES = ["system", "day", "night", "midnight"];
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
let themePref = THEMES.includes(store.get("mintyx.theme")) ? store.get("mintyx.theme") : "system";
let token = "";
let state = null;
let authMode = "password";
let region = "unsure";
let osTab = detectOS();
let pollTimer = 0;
let lastConnectError = null;

function t(key, vars) {
  let s = TEXT[lang][key];
  if (s === undefined) s = TEXT.en[key];
  if (s === undefined) return key;
  return s.replace(/\{(\w+)\}/g, (m, name) => (vars && name in vars ? vars[name] : m));
}

function detectOS() {
  const ua = navigator.userAgent || "";
  if (/Android/i.test(ua)) return "android";
  if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
  if (/Windows/i.test(ua)) return "windows";
  if (/Mac OS X|Macintosh/i.test(ua)) return "macos";
  return "linux";
}

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c) node.append(c);
  return node;
}

function applyStatic() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.documentElement.dataset.theme = themePref === "system" ? (darkQuery.matches ? "night" : "day") : themePref;
  for (const b of $("themeSeg").children) b.setAttribute("aria-pressed", String(b.dataset.pref === themePref));
  document.title = "Mintyx " + t("brandSub");
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
  for (const a of document.querySelectorAll("a[data-guide]")) {
    a.href = GUIDES[a.dataset.guide];
    a.target = "_blank";
    a.rel = "noopener noreferrer";
  }
  $("langToggle").textContent = t("langName");
}

async function api(method, path, body) {
  try {
    const resp = await fetch(path, {
      method,
      headers: Object.assign({ "X-Mintyx-Deploy": token }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store",
      credentials: "omit",
    });
    let data = null;
    if (resp.status !== 204 && resp.status !== 202) {
      try { data = await resp.json(); } catch (e) { data = null; }
    }
    if (!resp.ok) return { ok: false, error: (data && data.error) || { code: "error", message: "HTTP " + resp.status } };
    return { ok: true, data };
  } catch (e) {
    return { ok: false, error: { code: "network", message: String(e) } };
  }
}

function errorText(err) {
  const known = TEXT[lang]["e_" + err.code] !== undefined;
  return known ? t("e_" + err.code) : t("e_error");
}

function showError(box, err, withDetail) {
  box.replaceChildren();
  if (!err) { box.hidden = true; return; }
  box.append(el("strong", { text: errorText(err) }));
  if (withDetail && err.message) box.append(el("span", { class: "mono", text: err.message }));
  box.hidden = false;
}

function renderConnectError() {
  const box = $("connectError");
  const err = lastConnectError;
  for (const id of ["host", "port", "password", "privateKey", "passphrase"]) $(id).removeAttribute("aria-invalid");
  if (!err) { box.hidden = true; return; }
  box.className = err.code === "host_forgotten" ? "note warn" : "note err";
  if (err.field && $(err.field)) $(err.field).setAttribute("aria-invalid", "true");
  const detail = ["unreachable", "needs_root", "error", "invalid"].includes(err.code);
  showError(box, err, detail);
  if (err.code === "host_key_changed") {
    box.append(
      el("span", { text: t("e_hkc_body") }),
      el("span", { class: "mono", text: t("e_hkc_known") + (err.known || "") + "\n" + t("e_hkc_presented") + (err.presented || "") }),
      el("button", { class: "btn small danger", type: "button", text: t("forgetHost"), onclick: forgetHost }),
    );
  }
  if (err.code === "host_forgotten") {
    box.append(
      el("span", { text: t("e_hf_body") }),
      el("span", { class: "mono", text: t("e_hkc_presented") + (err.presented || "") }),
    );
  }
}

function connectInput() {
  const keyMode = authMode === "key";
  return {
    host: $("host").value.trim(),
    port: parseInt($("port").value, 10) || 22,
    user: $("user").value.trim() || "root",
    password: keyMode ? $("sudoPassword").value : $("password").value,
    privateKey: keyMode ? $("privateKey").value : "",
    passphrase: keyMode ? $("passphrase").value : "",
  };
}

async function connect(input) {
  lastInput = input;
  lastConnectError = null;
  renderConnectError();
  const btn = $("connectBtn");
  btn.disabled = true;
  btn.textContent = t("connecting");
  const res = await api("POST", "/api/connect", input);
  btn.disabled = false;
  btn.textContent = t("connect");
  if (!res.ok) {
    lastConnectError = res.error;
    renderConnectError();
    return;
  }
  /* The secrets are in the program's memory now; the page has no further use for them. */
  for (const id of ["password", "privateKey", "passphrase", "sudoPassword"]) $(id).value = "";
  lastInput = null;
  await refresh();
}

/* A changed host key may mean someone is in the middle, so forgetting it does not reconnect:
   the password is only sent again after the user has compared the new fingerprint and typed
   the password once more. */
async function forgetHost() {
  if (!lastInput) return;
  const presented = lastConnectError && lastConnectError.presented;
  const res = await api("POST", "/api/forget-host", { host: lastInput.host, port: lastInput.port });
  if (!res.ok) { lastConnectError = res.error; renderConnectError(); return; }
  for (const id of ["password", "sudoPassword"]) $(id).value = "";
  lastInput = null;
  lastConnectError = { code: "host_forgotten", presented };
  renderConnectError();
  $(authMode === "key" ? "sudoPassword" : "password").focus();
}

function renderRegions() {
  const box = $("regions");
  box.replaceChildren();
  const codes = ((state && state.regions) || []).concat(["unsure"]);
  for (const code of codes) {
    const input = el("input", { type: "radio", name: "region", value: code, onchange: () => { region = code; } });
    input.checked = code === region;
    box.append(el("label", { class: "chip" }, input, el("span", { text: t("region_" + code) })));
  }
}

function stepDetail(step) {
  const d = step.detail || "";
  if (step.status === "failed") return d;
  const key = "d_" + d;
  if (TEXT[lang][key] !== undefined) return t(key);
  if (step.id === "xray") return d.replace(" installed", "").replace(" present", "");
  if (step.id === "line") return d.replace("port ", "TCP ");
  return d;
}

function renderProgress(job) {
  const list = $("progress");
  list.hidden = !job;
  list.replaceChildren();
  if (!job) return;
  const marks = { done: "✓", failed: "×", skipped: "–" };
  for (const step of job.steps) {
    const detail = stepDetail(step);
    list.append(el("li", { "data-status": step.status || "" },
      el("span", { class: "dot", "aria-hidden": "true", text: marks[step.status] || "" }),
      el("span", {}, el("span", { text: t("s_" + step.id) }), detail ? el("span", { class: "detail", text: detail }) : null)));
  }
}

function renderResult(job) {
  const res = job && !job.running ? job.result : null;
  const hasPassword = !!(res && res.adminPassword);
  /* Its "use the password you saved" no longer applies once a reset put a new one on the page. */
  $("alreadyNote").hidden = !(res && res.alreadyDeployed) || hasPassword;
  $("resetCard").hidden = hasPassword;
  $("passwordCard").hidden = !hasPassword;
  // Disconnecting would throw the only copy of the password away; the server refuses it too.
  $("disconnectBtn").hidden = hasPassword;
  if (hasPassword) {
    $("adminUser").textContent = res.adminUser;
    $("adminPassword").textContent = res.adminPassword;
  } else {
    $("adminPassword").textContent = "";
  }

  const hasLink = !!(res && res.link);
  $("shareCard").hidden = !hasLink;
  $("appsCard").hidden = !hasLink;
  if (hasLink) {
    $("qr").src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(res.qrSvg);
    $("qr").alt = t("shareTitle");
    $("link").textContent = res.link;
    $("lineInfo").textContent = t("lineInfo", { port: res.port });
    const fw = res.firewall && res.firewall !== "none" ? t("fwOpened", { fw: res.firewall, port: res.port }) : t("fwNone");
    $("firewallNote").textContent = fw + " " + t("fwCloud", { port: res.port });
    renderApps();
  }
}

function renderApps() {
  const tabs = $("osTabs");
  tabs.replaceChildren();
  for (const os of Object.keys(APPS)) {
    tabs.append(el("button", { type: "button", role: "tab", "aria-selected": String(os === osTab), text: OS_NAMES[os],
      onclick: () => { osTab = os; renderApps(); } }));
  }
  const list = $("appList");
  list.replaceChildren();
  for (const name of APPS[osTab]) list.append(el("li", { text: name }));
}

function renderKeyLogin() {
  const box = $("keyOutcome");
  const k = state && state.keyLogin;
  const conn = state && state.connection;
  box.replaceChildren();
  box.hidden = !k;
  /* Advice only for a server that may still take passwords: sshd says so, or cannot tell and
     the user logged in with one. An outcome stays on screen either way. */
  const sshd = conn && conn.sshdPasswords;
  const advise = !!conn && (sshd === "on" || (sshd !== "off" && conn.passwordLogin));
  $("keyCard").hidden = !k && !advise;
  $("keyBtn").hidden = !!(k && k.outcome === "done");
  if (!k) return;
  const texts = { "done": "keyDone", "never-worked": "keyNever", "rolled-back": "keyRolled", "still-on": "keyStill", "error": "keyError" };
  box.className = "note " + (k.outcome === "done" ? "ok" : k.outcome === "still-on" ? "warn" : "err");
  box.append(el("strong", { text: t(texts[k.outcome] || "keyError") }));
  if (k.outcome === "still-on" && k.files && k.files.length) box.append(el("span", { text: t("keyStillFiles", { files: k.files.join(", ") }) }));
  if (k.outcome !== "done" && k.outcome !== "still-on" && k.message) box.append(el("span", { class: "mono", text: k.message }));
  if (k.keyPath && (k.outcome === "done" || k.outcome === "still-on")) {
    box.append(el("span", { text: t("keyPath", { path: k.keyPath }) + " " + t("keyBackup") }));
    if (conn) {
      const target = conn.host.includes(":") ? "[" + conn.host + "]" : conn.host;
      box.append(el("span", { text: t("keyCommand") }),
        el("span", { class: "mono", text: "ssh -i \"" + k.keyPath + "\" -p " + conn.port + " " + conn.user + "@" + target }));
    }
  }
}

function render() {
  applyStatic();
  $("noPayload").hidden = !(state && state.payload && state.payload.length === 0);
  const conn = state && state.connection;
  const job = state && state.deploy;
  const finished = !!(job && !job.running);
  const succeeded = finished && !job.error;
  const serviceUp = !!(job && job.steps.some((s) => s.id === "service" && s.status === "done"));

  $("connectView").hidden = !!conn;
  $("serverCard").hidden = !conn;
  $("deployView").hidden = !conn || succeeded;
  $("resultView").hidden = !conn || !finished;
  $("toolsView").hidden = !conn || !finished || !serviceUp;

  const current = !conn ? "connect" : succeeded ? "done" : "deploy";
  const order = ["connect", "deploy", "done"];
  for (const li of $("stepper").children) {
    const i = order.indexOf(li.dataset.step);
    if (li.dataset.step === current) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
    li.classList.toggle("past", i < order.indexOf(current));
  }

  renderConnectError();
  if (conn) {
    const target = conn.host.includes(":") ? "[" + conn.host + "]" : conn.host;
    $("serverName").textContent = conn.user + "@" + target + (conn.port === 22 ? "" : ":" + conn.port);
    $("serverFingerprint").textContent = t("fingerprint") + " " + conn.fingerprint + (conn.firstSeen ? " (" + t("fingerprintNew") + ")" : "");
  }
  renderRegions();
  renderProgress(job);
  const deployBtn = $("deployBtn");
  deployBtn.disabled = !!(job && job.running);
  deployBtn.textContent = job && job.running ? t("deploying") : job && job.error ? t("retry") : t("deploy");
  showError($("deployError"), finished ? job.error : null, true);
  renderResult(job);
  renderKeyLogin();
}

async function refresh() {
  const res = await api("GET", "/api/state");
  if (!res.ok) {
    if (res.error.code === "unauthorized" || res.error.code === "forbidden") { $("app").hidden = true; $("noToken").hidden = false; }
    return;
  }
  state = res.data;
  render();
  clearTimeout(pollTimer);
  if (state.deploy && state.deploy.running) pollTimer = setTimeout(refresh, 800);
}

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const area = el("textarea", {});
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  const label = button.dataset.i18n;
  button.textContent = t("copied");
  setTimeout(() => { button.textContent = t(label); }, 1500);
}

function setAuthMode(mode) {
  authMode = mode;
  $("authPassword").setAttribute("aria-pressed", String(mode === "password"));
  $("authKey").setAttribute("aria-pressed", String(mode === "key"));
  $("passwordFields").hidden = mode !== "password";
  $("keyFields").hidden = mode !== "key";
}

function wire() {
  $("langToggle").addEventListener("click", () => { lang = lang === "zh" ? "en" : "zh"; store.set("mintyx.lang", lang); render(); });
  for (const b of $("themeSeg").children) {
    b.addEventListener("click", () => { themePref = b.dataset.pref; store.set("mintyx.theme", themePref); applyStatic(); });
  }
  $("authPassword").addEventListener("click", () => setAuthMode("password"));
  $("authKey").addEventListener("click", () => setAuthMode("key"));
  $("keyFileBtn").addEventListener("click", () => $("keyFile").click());
  $("keyFile").addEventListener("change", async (ev) => {
    const file = ev.target.files[0];
    if (file && file.size < 65536) $("privateKey").value = await file.text();
    ev.target.value = "";
  });
  $("connectForm").addEventListener("submit", (ev) => { ev.preventDefault(); connect(connectInput()); });
  $("disconnectBtn").addEventListener("click", async () => { await api("POST", "/api/disconnect"); await refresh(); });
  $("deployBtn").addEventListener("click", async () => {
    $("deployBtn").disabled = true;
    const res = await api("POST", "/api/deploy", { region, clientName: lang === "zh" ? "我的设备" : "My device" });
    if (!res.ok) { showError($("deployError"), res.error, true); $("deployBtn").disabled = false; if (res.error.code === "not_connected") await refresh(); return; }
    await refresh();
  });
  $("copyPassword").addEventListener("click", (ev) => copyText($("adminPassword").textContent, ev.currentTarget));
  $("copyLink").addEventListener("click", (ev) => copyText($("link").textContent, ev.currentTarget));
  $("passwordSaved").addEventListener("click", async () => { await api("POST", "/api/password-saved"); await refresh(); });
  $("openPanel").addEventListener("click", async () => {
    const btn = $("openPanel");
    btn.disabled = true;
    btn.textContent = t("openingPanel");
    /* Opened before the request so the browser still counts it as the user's own click. */
    const tab = window.open("", "_blank");
    const res = await api("POST", "/api/tunnel");
    btn.disabled = false;
    btn.textContent = t("openPanel");
    showError($("panelError"), res.ok ? null : res.error, true);
    if (!res.ok) { if (tab) tab.close(); return; }
    const link = $("panelLink");
    link.href = res.data.url;
    link.textContent = res.data.url;
    link.hidden = false;
    if (tab) { tab.opener = null; tab.location.replace(res.data.url); }
  });
  $("resetBtn").addEventListener("click", async () => {
    const btn = $("resetBtn");
    btn.disabled = true;
    btn.textContent = t("resetRunning");
    const res = await api("POST", "/api/reset-password");
    btn.disabled = false;
    btn.textContent = t("resetBtn");
    showError($("resetError"), res.ok ? null : res.error, true);
    if (res.ok || res.error.code === "not_connected") await refresh();
  });
  $("keyBtn").addEventListener("click", async () => {
    const btn = $("keyBtn");
    btn.disabled = true;
    btn.textContent = t("keyRunning");
    const res = await api("POST", "/api/key-login");
    btn.disabled = false;
    btn.textContent = t("keyBtn");
    if (!res.ok) { state.keyLogin = { outcome: "error", message: res.error.message, files: [], keyPath: "" }; renderKeyLogin(); return; }
    await refresh();
  });
}

function readToken() {
  const m = /[#&]t=([A-Za-z0-9_-]+)/.exec(location.hash);
  if (m) {
    try { sessionStorage.setItem("mintyx.token", m[1]); } catch (e) { /* the token then lives for this page load only */ }
    history.replaceState(null, "", location.pathname);
    return m[1];
  }
  try { return sessionStorage.getItem("mintyx.token") || ""; } catch (e) { return ""; }
}

applyStatic();
darkQuery.addEventListener("change", () => { if (themePref === "system") applyStatic(); });
token = readToken();
if (!token) {
  $("noToken").hidden = false;
} else {
  $("app").hidden = false;
  wire();
  refresh();
}
</script>
</body>
</html>
